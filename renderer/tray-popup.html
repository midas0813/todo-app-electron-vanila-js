<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>Today's Time</title>
<style>
  :root {
    --bg-elevated: #1c1f27;
    --bg-elevated-2: #23262f;
    --border: #2d313c;
    --text: #e8eaed;
    --text-dim: #9aa0ac;
    --accent: #6c8cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-elevated);
    color: var(--text);
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .tp-header { padding: 12px 14px 2px; font-weight: 700; font-size: 13px; }
  .tp-date { color: var(--text-dim); font-size: 11px; padding: 0 14px 10px; }
  .tp-rows { padding: 0 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .tp-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-elevated-2);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .tp-row-label { display: flex; align-items: center; gap: 8px; }
  .tp-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .tp-value { font-variant-numeric: tabular-nums; font-weight: 600; }
  .tp-footer { padding: 10px 14px 14px; }
  .tp-open-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .tp-open-btn:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div class="tp-header">Today's Time</div>
  <div class="tp-date" id="tp-date"></div>
  <div class="tp-rows">
    <div class="tp-row">
      <span class="tp-row-label"><span class="tp-dot" style="background:#57c785"></span>Active</span>
      <span class="tp-value" id="tp-active">00:00:00</span>
    </div>
    <div class="tp-row">
      <span class="tp-row-label"><span class="tp-dot" style="background:#ffb84d"></span>Idle</span>
      <span class="tp-value" id="tp-idle">00:00:00</span>
    </div>
    <div class="tp-row">
      <span class="tp-row-label"><span class="tp-dot" style="background:#a389f4"></span>Locked</span>
      <span class="tp-value" id="tp-locked">00:00:00</span>
    </div>
    <div class="tp-row">
      <span class="tp-row-label"><span class="tp-dot" style="background:#3a3f4b"></span>Untracked</span>
      <span class="tp-value" id="tp-untracked">00:00:00</span>
    </div>
  </div>
  <div class="tp-footer">
    <button type="button" class="tp-open-btn" id="tp-open-btn">Open Midas</button>
  </div>
  <script src="tray-popup.js"></script>
</body>
</html>
